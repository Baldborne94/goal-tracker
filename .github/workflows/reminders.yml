name: Send push reminders

# Vercel's free Hobby plan only allows a once-a-day cron, which is far too
# coarse for time-of-day reminders. This workflow pings the reminders endpoint
# every few minutes instead. The endpoint itself decides what's actually due
# (and dedupes), so extra pings are harmless.
on:
  schedule:
    # GitHub's minimum interval is 5 minutes; runs can be delayed under load,
    # which the endpoint's delivery window tolerates.
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger reminders endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ]; then
            echo "APP_URL secret is not set — add it in repo Settings → Secrets and variables → Actions."
            exit 1
          fi
          curl -fsS -m 60 "${APP_URL%/}/api/cron/reminders?secret=${CRON_SECRET}"
