<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bg" cx="50%" cy="65%">
      <stop offset="0%" stop-color="#1c0505"/>
      <stop offset="45%" stop-color="#0a0110"/>
      <stop offset="100%" stop-color="#030008"/>
    </radialGradient>
    <radialGradient id="forge" cx="50%" cy="75%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crownAmbience" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="40%" stop-color="#374151"/>
      <stop offset="55%" stop-color="#9ca3af"/>
      <stop offset="75%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="bloodGem" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="goldGem" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
  </defs>

  <!-- Deep dark background -->
  <rect width="192" height="192" rx="36" fill="url(#bg)"/>

  <!-- Forge glow rising from below -->
  <ellipse cx="96" cy="168" rx="90" ry="55" fill="url(#forge)"/>

  <!-- Faint crown ambience -->
  <ellipse cx="96" cy="95" rx="60" ry="45" fill="url(#crownAmbience)"/>

  <!-- Sparse distant stars -->
  <circle cx="22" cy="18" r="0.9" fill="#fde68a" opacity="0.55"/>
  <circle cx="172" cy="12" r="0.7" fill="white" opacity="0.4"/>
  <circle cx="180" cy="42" r="1" fill="white" opacity="0.3"/>
  <circle cx="12" cy="68" r="0.7" fill="#fde68a" opacity="0.35"/>
  <circle cx="183" cy="95" r="0.9" fill="white" opacity="0.25"/>
  <circle cx="168" cy="22" r="1.1" fill="#fca5a5" opacity="0.4"/>
  <circle cx="36" cy="168" r="0.8" fill="#fde68a" opacity="0.3"/>

  <!-- Runic outer ring (very subtle) -->
  <circle cx="96" cy="96" r="86" fill="none" stroke="#7f1d1d" stroke-width="0.7" stroke-dasharray="4,8" opacity="0.35"/>

  <!-- === CROWN === -->

  <!-- Crown base band -->
  <path d="M32 118 Q32 124 38 124 L154 124 Q160 124 160 118 L160 108 L32 108 Z"
        fill="url(#metalDark)"/>
  <!-- Band top highlight -->
  <rect x="32" y="108" width="128" height="4" rx="1" fill="#fde68a" opacity="0.18"/>
  <!-- Band engraved line -->
  <line x1="36" y1="116" x2="156" y2="116" stroke="#f59e0b" stroke-width="0.7" opacity="0.3"/>

  <!-- Crown spikes (5) — drawn as filled shapes for solid gothic look -->

  <!-- Spike 1: far left -->
  <polygon points="42,108 50,58 66,108" fill="url(#metalDark)"/>
  <polygon points="50,58 47,108 53,108" fill="#d97706" opacity="0.25"/>

  <!-- Spike 2: left-center -->
  <polygon points="66,108 80,72 98,108" fill="url(#metalDark)"/>
  <polygon points="80,72 77,108 83,108" fill="#d97706" opacity="0.25"/>

  <!-- Spike 3: CENTER (tallest — the "master" peak) -->
  <polygon points="80,108 96,36 112,108" fill="url(#metalLight)"/>
  <!-- Center spike inner shadow -->
  <polygon points="80,108 96,36 88,108" fill="#451a03" opacity="0.35"/>
  <!-- Center spike edge shine -->
  <line x1="96" y1="36" x2="80" y2="108" stroke="#fde68a" stroke-width="1" opacity="0.4"/>
  <line x1="96" y1="36" x2="112" y2="108" stroke="#fde68a" stroke-width="1" opacity="0.4"/>

  <!-- Spike 4: right-center -->
  <polygon points="94,108 112,72 126,108" fill="url(#metalDark)"/>
  <polygon points="112,72 109,108 115,108" fill="#d97706" opacity="0.25"/>

  <!-- Spike 5: far right -->
  <polygon points="126,108 142,58 150,108" fill="url(#metalDark)"/>
  <polygon points="142,58 139,108 145,108" fill="#d97706" opacity="0.25"/>

  <!-- Spike tip gems -->

  <!-- Far left tip: blood ruby -->
  <circle cx="50" cy="58" r="5.5" fill="#1a0000"/>
  <circle cx="50" cy="58" r="4" fill="url(#bloodGem)"/>
  <circle cx="48.5" cy="56.5" r="1.3" fill="white" opacity="0.55"/>

  <!-- Left-center tip: blood ruby -->
  <circle cx="80" cy="72" r="4.5" fill="#1a0000"/>
  <circle cx="80" cy="72" r="3.2" fill="url(#bloodGem)"/>
  <circle cx="79" cy="71" r="1" fill="white" opacity="0.5"/>

  <!-- CENTER tip: gold topaz (the eye of mastery) -->
  <circle cx="96" cy="36" r="8" fill="#1a0500"/>
  <circle cx="96" cy="36" r="6" fill="url(#goldGem)"/>
  <circle cx="93.5" cy="33.5" r="2" fill="white" opacity="0.7"/>
  <!-- Glow ring around center gem -->
  <circle cx="96" cy="36" r="10" fill="none" stroke="#f59e0b" stroke-width="1" opacity="0.4"/>

  <!-- Right-center tip: blood ruby -->
  <circle cx="112" cy="72" r="4.5" fill="#1a0000"/>
  <circle cx="112" cy="72" r="3.2" fill="url(#bloodGem)"/>
  <circle cx="111" cy="71" r="1" fill="white" opacity="0.5"/>

  <!-- Far right tip: blood ruby -->
  <circle cx="142" cy="58" r="5.5" fill="#1a0000"/>
  <circle cx="142" cy="58" r="4" fill="url(#bloodGem)"/>
  <circle cx="140.5" cy="56.5" r="1.3" fill="white" opacity="0.55"/>

  <!-- Crown band gems (3 along the base) -->
  <!-- Left gem -->
  <ellipse cx="55" cy="116" rx="7" ry="5.5" fill="#0d0000"/>
  <ellipse cx="55" cy="116" rx="5.5" ry="4" fill="url(#bloodGem)"/>
  <ellipse cx="53.5" cy="114.5" rx="1.5" ry="1.2" fill="white" opacity="0.5"/>

  <!-- Center gem (golden eye — centerpiece) -->
  <ellipse cx="96" cy="116" rx="10" ry="7" fill="#1a0500"/>
  <ellipse cx="96" cy="116" rx="8" ry="5.5" fill="url(#goldGem)"/>
  <ellipse cx="93.5" cy="114" rx="2.5" ry="1.8" fill="white" opacity="0.6"/>
  <!-- Glow -->
  <ellipse cx="96" cy="116" rx="15" ry="11" fill="url(#crownAmbience)" opacity="0.8"/>

  <!-- Right gem -->
  <ellipse cx="137" cy="116" rx="7" ry="5.5" fill="#0d0000"/>
  <ellipse cx="137" cy="116" rx="5.5" ry="4" fill="url(#bloodGem)"/>
  <ellipse cx="135.5" cy="114.5" rx="1.5" ry="1.2" fill="white" opacity="0.5"/>

  <!-- === SWORD (below crown) === -->

  <!-- Sword crossguard -->
  <rect x="74" y="128" width="44" height="10" rx="3.5" fill="#1f2937"/>
  <rect x="74" y="128" width="44" height="4" rx="3.5" fill="#374151" opacity="0.7"/>
  <!-- Guard side decorations -->
  <rect x="68" y="130" width="10" height="6" rx="2" fill="#374151"/>
  <rect x="114" y="130" width="10" height="6" rx="2" fill="#374151"/>
  <circle cx="68" cy="133" r="3.5" fill="#1f2937"/>
  <circle cx="68" cy="133" r="2.2" fill="#dc2626" opacity="0.6"/>
  <circle cx="124" cy="133" r="3.5" fill="#1f2937"/>
  <circle cx="124" cy="133" r="2.2" fill="#dc2626" opacity="0.6"/>

  <!-- Sword grip/handle -->
  <rect x="91.5" y="138" width="9" height="22" rx="2.5" fill="#1a0a00"/>
  <rect x="91.5" y="143" width="9" height="2" rx="1" fill="#f59e0b" opacity="0.55"/>
  <rect x="91.5" y="149" width="9" height="2" rx="1" fill="#f59e0b" opacity="0.55"/>
  <rect x="91.5" y="155" width="9" height="2" rx="1" fill="#f59e0b" opacity="0.55"/>

  <!-- Sword pommel -->
  <ellipse cx="96" cy="162" rx="9" ry="6.5" fill="#1f2937"/>
  <ellipse cx="96" cy="161" rx="6" ry="4.2" fill="#374151"/>
  <circle cx="96" cy="160.5" r="2.2" fill="#dc2626" opacity="0.5"/>

  <!-- Sword blade (pointing downward) -->
  <rect x="92.5" y="163" width="7" height="14" rx="1.5" fill="url(#blade)"/>
  <polygon points="96,179 91.5,163 100.5,163" fill="#374151" opacity="0.8"/>
  <!-- Blade tip -->
  <polygon points="96,182 93,172 99,172" fill="#6b7280"/>
  <polygon points="96,182 95,172 97,172" fill="#e5e7eb" opacity="0.3"/>

  <!-- Dripping shadow beneath crown (atmospheric depth) -->
  <ellipse cx="96" cy="126" rx="65" ry="6" fill="#000000" opacity="0.45"/>
</svg>
