<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <radialGradient id="bgG" cx="50%" cy="38%">
      <stop offset="0%" stop-color="#1a0a3e"/>
      <stop offset="100%" stop-color="#07021a"/>
    </radialGradient>
    <linearGradient id="shieldG" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#2d1270"/>
      <stop offset="100%" stop-color="#120838"/>
    </linearGradient>
    <linearGradient id="bladeG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="35%" stop-color="#e0e7ff"/>
      <stop offset="65%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <radialGradient id="glowG" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gemG" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#f0abfc"/>
      <stop offset="45%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#4c1d95"/>
    </radialGradient>
    <radialGradient id="orbG" cx="40%" cy="40%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#b45309"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="192" height="192" rx="38" fill="url(#bgG)"/>

  <!-- Star field -->
  <circle cx="26" cy="26" r="1.2" fill="white" opacity="0.7"/>
  <circle cx="168" cy="20" r="0.9" fill="white" opacity="0.5"/>
  <circle cx="174" cy="58" r="1.4" fill="#c4b5fd" opacity="0.55"/>
  <circle cx="16" cy="90" r="0.9" fill="white" opacity="0.4"/>
  <circle cx="177" cy="118" r="1.2" fill="#fde68a" opacity="0.55"/>
  <circle cx="20" cy="152" r="1" fill="white" opacity="0.5"/>
  <circle cx="164" cy="168" r="1.3" fill="white" opacity="0.4"/>
  <circle cx="42" cy="172" r="0.9" fill="#c4b5fd" opacity="0.45"/>
  <circle cx="152" cy="28" r="1" fill="#fde68a" opacity="0.5"/>

  <!-- Shield outer -->
  <path d="M96 16 L163 47 L163 108 Q163 160 96 178 Q29 160 29 108 L29 47 Z"
        fill="url(#shieldG)" stroke="#6d28d9" stroke-width="2.5" stroke-linejoin="round"/>

  <!-- Shield inner border (gold) -->
  <path d="M96 29 L151 56 L151 110 Q151 150 96 165 Q41 150 41 110 L41 56 Z"
        fill="none" stroke="#f59e0b" stroke-width="1.3" opacity="0.5" stroke-linejoin="round"/>

  <!-- Shield inner border (subtle violet) -->
  <path d="M96 36 L145 61 L145 112 Q145 146 96 158 Q47 146 47 112 L47 61 Z"
        fill="none" stroke="#8b5cf6" stroke-width="0.8" opacity="0.3" stroke-linejoin="round"/>

  <!-- Glow behind sword -->
  <ellipse cx="96" cy="90" rx="16" ry="52" fill="url(#glowG)"/>

  <!-- Sword blade -->
  <rect x="92" y="21" width="8" height="105" rx="2" fill="url(#bladeG)"/>
  <!-- Blade center shine -->
  <rect x="94.5" y="21" width="3" height="95" rx="1.5" fill="white" opacity="0.22"/>

  <!-- Sword tip -->
  <polygon points="96,11 89,34 103,34" fill="#dde5f0"/>
  <polygon points="96,11 94.5,34 97.5,34" fill="white" opacity="0.5"/>

  <!-- Cross guard body -->
  <rect x="60" y="83" width="72" height="15" rx="5.5" fill="#d97706"/>
  <rect x="60" y="83" width="72" height="6.5" rx="5.5" fill="#fde68a" opacity="0.45"/>

  <!-- Guard left orb -->
  <circle cx="60" cy="90.5" r="9" fill="#b45309"/>
  <circle cx="60" cy="90.5" r="7" fill="url(#orbG)"/>
  <circle cx="57.5" cy="88" r="2.2" fill="white" opacity="0.55"/>

  <!-- Guard right orb -->
  <circle cx="132" cy="90.5" r="9" fill="#b45309"/>
  <circle cx="132" cy="90.5" r="7" fill="url(#orbG)"/>
  <circle cx="129.5" cy="88" r="2.2" fill="white" opacity="0.55"/>

  <!-- Central gem -->
  <circle cx="96" cy="90.5" r="10" fill="#3b0764"/>
  <circle cx="96" cy="90.5" r="8" fill="url(#gemG)"/>
  <circle cx="93" cy="87.5" r="2.8" fill="white" opacity="0.6"/>
  <circle cx="99" cy="93.5" r="1.2" fill="white" opacity="0.2"/>

  <!-- Sword handle -->
  <rect x="90.5" y="104" width="11" height="34" rx="3.5" fill="#92400e"/>
  <!-- Handle wrapping bands -->
  <rect x="90.5" y="110" width="11" height="2.5" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="90.5" y="117" width="11" height="2.5" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="90.5" y="124" width="11" height="2.5" rx="1" fill="#f59e0b" opacity="0.7"/>
  <rect x="90.5" y="131" width="11" height="2.5" rx="1" fill="#f59e0b" opacity="0.7"/>

  <!-- Pommel -->
  <ellipse cx="96" cy="141" rx="11.5" ry="8" fill="#b45309"/>
  <ellipse cx="96" cy="140" rx="8" ry="5.5" fill="url(#orbG)"/>
  <circle cx="96" cy="139" r="2.5" fill="white" opacity="0.35"/>

  <!-- Crown at top of shield -->
  <rect x="80" y="38" width="5.5" height="11" rx="1.5" fill="#f59e0b" opacity="0.85"/>
  <rect x="93.5" y="33" width="5.5" height="16" rx="1.5" fill="#f59e0b"/>
  <rect x="107" y="38" width="5.5" height="11" rx="1.5" fill="#f59e0b" opacity="0.85"/>
  <circle cx="82.5" cy="37" r="3" fill="#fbbf24"/>
  <circle cx="96" cy="32" r="3.5" fill="#fbbf24"/>
  <circle cx="109.5" cy="37" r="3" fill="#fbbf24"/>

  <!-- Side diamond decorations -->
  <polygon points="49,70 54,76 49,82 44,76" fill="#c4b5fd" opacity="0.45"/>
  <polygon points="143,70 148,76 143,82 138,76" fill="#c4b5fd" opacity="0.45"/>
  <polygon points="49,112 53,117 49,122 45,117" fill="#c4b5fd" opacity="0.3"/>
  <polygon points="143,112 147,117 143,122 139,117" fill="#c4b5fd" opacity="0.3"/>

  <!-- Sparkle top-left of shield -->
  <line x1="46" y1="58" x2="46" y2="66" stroke="#fde68a" stroke-width="1.2" opacity="0.5"/>
  <line x1="42" y1="62" x2="50" y2="62" stroke="#fde68a" stroke-width="1.2" opacity="0.5"/>
  <!-- Sparkle top-right of shield -->
  <line x1="146" y1="58" x2="146" y2="66" stroke="#fde68a" stroke-width="1.2" opacity="0.5"/>
  <line x1="142" y1="62" x2="150" y2="62" stroke="#fde68a" stroke-width="1.2" opacity="0.5"/>
</svg>
