<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="65%">
      <stop offset="0%" stop-color="#1c0505"/>
      <stop offset="45%" stop-color="#0a0110"/>
      <stop offset="100%" stop-color="#030008"/>
    </radialGradient>
    <radialGradient id="forge" cx="50%" cy="75%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#7f1d1d" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#7f1d1d" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="crownAmbience" cx="50%" cy="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metalDark" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#d97706"/>
      <stop offset="30%" stop-color="#92400e"/>
      <stop offset="70%" stop-color="#451a03"/>
      <stop offset="100%" stop-color="#1c0a00"/>
    </linearGradient>
    <linearGradient id="metalLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="blade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="40%" stop-color="#374151"/>
      <stop offset="55%" stop-color="#9ca3af"/>
      <stop offset="75%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#111827"/>
    </linearGradient>
    <radialGradient id="bloodGem" cx="38%" cy="32%">
      <stop offset="0%" stop-color="#fca5a5"/>
      <stop offset="40%" stop-color="#dc2626"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
    <radialGradient id="goldGem" cx="35%" cy="30%">
      <stop offset="0%" stop-color="#fef3c7"/>
      <stop offset="35%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#451a03"/>
    </radialGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- Forge glow -->
  <ellipse cx="256" cy="448" rx="240" ry="147" fill="url(#forge)"/>

  <!-- Crown ambience -->
  <ellipse cx="256" cy="253" rx="160" ry="120" fill="url(#crownAmbience)"/>

  <!-- Stars -->
  <circle cx="58" cy="48" r="2.4" fill="#fde68a" opacity="0.55"/>
  <circle cx="460" cy="32" r="1.9" fill="white" opacity="0.4"/>
  <circle cx="480" cy="112" r="2.7" fill="white" opacity="0.3"/>
  <circle cx="32" cy="181" r="1.9" fill="#fde68a" opacity="0.35"/>
  <circle cx="488" cy="253" r="2.4" fill="white" opacity="0.25"/>
  <circle cx="449" cy="59" r="2.9" fill="#fca5a5" opacity="0.4"/>
  <circle cx="96" cy="449" r="2.1" fill="#fde68a" opacity="0.3"/>
  <circle cx="420" cy="430" r="2.4" fill="white" opacity="0.25"/>

  <!-- Runic ring -->
  <circle cx="256" cy="256" r="229" fill="none" stroke="#7f1d1d" stroke-width="1.9" stroke-dasharray="11,21" opacity="0.35"/>

  <!-- === CROWN === -->

  <!-- Crown base band -->
  <path d="M85 315 Q85 331 101 331 L411 331 Q427 331 427 315 L427 288 L85 288 Z"
        fill="url(#metalDark)"/>
  <rect x="85" y="288" width="342" height="11" rx="3" fill="#fde68a" opacity="0.18"/>
  <line x1="96" y1="315" x2="416" y2="315" stroke="#f59e0b" stroke-width="1.9" opacity="0.3"/>

  <!-- Spike 1: far left -->
  <polygon points="112,288 134,155 176,288" fill="url(#metalDark)"/>
  <polygon points="134,155 125,288 143,288" fill="#d97706" opacity="0.25"/>

  <!-- Spike 2: left-center -->
  <polygon points="176,288 213,192 261,288" fill="url(#metalDark)"/>
  <polygon points="213,192 205,288 221,288" fill="#d97706" opacity="0.25"/>

  <!-- Spike 3: CENTER -->
  <polygon points="213,288 256,96 299,288" fill="url(#metalLight)"/>
  <polygon points="213,288 256,96 234,288" fill="#451a03" opacity="0.35"/>
  <line x1="256" y1="96" x2="213" y2="288" stroke="#fde68a" stroke-width="2.7" opacity="0.4"/>
  <line x1="256" y1="96" x2="299" y2="288" stroke="#fde68a" stroke-width="2.7" opacity="0.4"/>

  <!-- Spike 4: right-center -->
  <polygon points="251,288 299,192 336,288" fill="url(#metalDark)"/>
  <polygon points="299,192 291,288 307,288" fill="#d97706" opacity="0.25"/>

  <!-- Spike 5: far right -->
  <polygon points="336,288 378,155 400,288" fill="url(#metalDark)"/>
  <polygon points="378,155 369,288 387,288" fill="#d97706" opacity="0.25"/>

  <!-- Tip gems -->
  <!-- Far left -->
  <circle cx="134" cy="155" r="14.5" fill="#1a0000"/>
  <circle cx="134" cy="155" r="10.5" fill="url(#bloodGem)"/>
  <circle cx="130" cy="151" r="3.5" fill="white" opacity="0.55"/>

  <!-- Left-center -->
  <circle cx="213" cy="192" r="12" fill="#1a0000"/>
  <circle cx="213" cy="192" r="8.5" fill="url(#bloodGem)"/>
  <circle cx="210" cy="189" r="2.7" fill="white" opacity="0.5"/>

  <!-- CENTER (gold) -->
  <circle cx="256" cy="96" r="21" fill="#1a0500"/>
  <circle cx="256" cy="96" r="16" fill="url(#goldGem)"/>
  <circle cx="249" cy="89" r="5.3" fill="white" opacity="0.7"/>
  <circle cx="256" cy="96" r="26" fill="none" stroke="#f59e0b" stroke-width="2.7" opacity="0.4"/>

  <!-- Right-center -->
  <circle cx="299" cy="192" r="12" fill="#1a0000"/>
  <circle cx="299" cy="192" r="8.5" fill="url(#bloodGem)"/>
  <circle cx="296" cy="189" r="2.7" fill="white" opacity="0.5"/>

  <!-- Far right -->
  <circle cx="378" cy="155" r="14.5" fill="#1a0000"/>
  <circle cx="378" cy="155" r="10.5" fill="url(#bloodGem)"/>
  <circle cx="374" cy="151" r="3.5" fill="white" opacity="0.55"/>

  <!-- Band gems -->
  <!-- Left -->
  <ellipse cx="147" cy="309" rx="19" ry="14.5" fill="#0d0000"/>
  <ellipse cx="147" cy="309" rx="14.5" ry="10.5" fill="url(#bloodGem)"/>
  <ellipse cx="143" cy="305" rx="4" ry="3.2" fill="white" opacity="0.5"/>

  <!-- Center (golden eye) -->
  <ellipse cx="256" cy="309" rx="27" ry="19" fill="#1a0500"/>
  <ellipse cx="256" cy="309" rx="21" ry="14.5" fill="url(#goldGem)"/>
  <ellipse cx="249" cy="303" rx="6.5" ry="4.8" fill="white" opacity="0.6"/>
  <ellipse cx="256" cy="309" rx="40" ry="29" fill="url(#crownAmbience)" opacity="0.8"/>

  <!-- Right -->
  <ellipse cx="365" cy="309" rx="19" ry="14.5" fill="#0d0000"/>
  <ellipse cx="365" cy="309" rx="14.5" ry="10.5" fill="url(#bloodGem)"/>
  <ellipse cx="361" cy="305" rx="4" ry="3.2" fill="white" opacity="0.5"/>

  <!-- === SWORD === -->

  <!-- Crossguard -->
  <rect x="197" y="341" width="118" height="27" rx="9.5" fill="#1f2937"/>
  <rect x="197" y="341" width="118" height="11" rx="9.5" fill="#374151" opacity="0.7"/>
  <rect x="181" y="346" width="27" height="16" rx="5.3" fill="#374151"/>
  <rect x="304" y="346" width="27" height="16" rx="5.3" fill="#374151"/>
  <circle cx="181" cy="354" r="9.5" fill="#1f2937"/>
  <circle cx="181" cy="354" r="5.9" fill="#dc2626" opacity="0.6"/>
  <circle cx="331" cy="354" r="9.5" fill="#1f2937"/>
  <circle cx="331" cy="354" r="5.9" fill="#dc2626" opacity="0.6"/>

  <!-- Grip -->
  <rect x="244" y="368" width="24" height="59" rx="6.7" fill="#1a0a00"/>
  <rect x="244" y="382" width="24" height="5.3" rx="2.7" fill="#f59e0b" opacity="0.55"/>
  <rect x="244" y="398" width="24" height="5.3" rx="2.7" fill="#f59e0b" opacity="0.55"/>
  <rect x="244" y="414" width="24" height="5.3" rx="2.7" fill="#f59e0b" opacity="0.55"/>

  <!-- Pommel -->
  <ellipse cx="256" cy="432" rx="24" ry="17" fill="#1f2937"/>
  <ellipse cx="256" cy="430" rx="16" ry="11" fill="#374151"/>
  <circle cx="256" cy="429" r="5.9" fill="#dc2626" opacity="0.5"/>

  <!-- Blade -->
  <rect x="247" y="432" width="18" height="37" rx="4" fill="url(#blade)"/>
  <polygon points="256,477 247,449 265,449" fill="#374151" opacity="0.8"/>
  <polygon points="256,480 251,459 261,459" fill="#6b7280"/>
  <polygon points="256,480 254,459 258,459" fill="#e5e7eb" opacity="0.3"/>

  <!-- Shadow depth under crown -->
  <ellipse cx="256" cy="336" rx="173" ry="16" fill="#000000" opacity="0.45"/>
</svg>
